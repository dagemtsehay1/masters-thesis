# Favors recognition quality over resource usage.

camera:
  resolution: [1280, 720]
  preview_fps: 30

gesture:
  min_hand_detection_confidence: 0.75
  min_tracking_confidence: 0.75
  inference_fps: 30

speech:
  whisper:
    model: small
  # FusionEngine automatically caps fusion.minimum_confidence.voice at this
  # value (see src/config/schema.py's MinimumConfidenceConfig comment), so
  # lowering it here alone is enough - no matching fusion override needed.
  confidence_threshold: 0.45

logging:
  level: DEBUG
