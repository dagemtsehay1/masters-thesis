[project]
name = "new-master-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coppeliasim-zmqremoteapi-client>=2.0.4",
    "faster-whisper>=1.0",
    "mediapipe>=0.10.33",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pydantic>=2.6",
    "pyside6>=6.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "sounddevice>=0.5.5",
    "webrtcvad>=2.0.10",
